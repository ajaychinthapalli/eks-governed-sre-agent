<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif">
  <title>Governed SRE Agent on Amazon EKS: as built</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Governed SRE Agent on Amazon EKS — as built</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#475569">Every model call and every tool call passes the gateway; the Kubernetes API server enforces the final limits</text>

  <!-- cluster frame -->
  <rect x="20" y="80" width="990" height="700" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="108" font-size="15" font-weight="700" fill="#9a3412">Amazon EKS cluster · default-deny egress on platform namespaces · Pod Security baseline (warn restricted)</text>

  <!-- operator -->
  <rect x="40" y="130" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">SRE / operator</text>
  <text x="140" y="180" text-anchor="middle" font-size="12" fill="#1e40af">port-forward (dev) · OIDC (prod)</text>

  <!-- kagent -->
  <rect x="300" y="125" width="600" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="150" font-size="15" font-weight="700" fill="#14532d">ns kagent</text>
  <rect x="320" y="162" width="170" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="405" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">kagent UI</text>
  <text x="405" y="205" text-anchor="middle" font-size="11" fill="#166534">chat + approvals</text>
  <rect x="505" y="162" width="170" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="590" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">kagent controller</text>
  <text x="590" y="205" text-anchor="middle" font-size="11" fill="#166534">Postgres · 30-day retention</text>
  <rect x="690" y="162" width="190" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="785" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">sre-triage-agent</text>
  <text x="785" y="205" text-anchor="middle" font-size="11" fill="#166534">ModelConfig governed-llm</text>
  <line x1="240" y1="165" x2="318" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- gateway -->
  <rect x="200" y="280" width="800" height="150" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="220" y="305" font-size="15" font-weight="700" fill="#881337">ns agentgateway-system · agentgateway-proxy (ClusterIP, HPA 2–6, PDB)</text>
  <rect x="220" y="318" width="250" height="98" rx="8" fill="#ffffff" stroke="#fda4af"/>
  <text x="345" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#881337">/v1/chat/completions</text>
  <text x="345" y="360" text-anchor="middle" font-size="11" fill="#9f1239">token + request budget → 429</text>
  <text x="345" y="377" text-anchor="middle" font-size="11" fill="#9f1239">secret guard (AKIA, PEM, gh_, xox) → 403</text>
  <text x="345" y="394" text-anchor="middle" font-size="11" fill="#9f1239">SigV4 with its own IAM role</text>
  <rect x="490" y="318" width="240" height="98" rx="8" fill="#ffffff" stroke="#fda4af"/>
  <text x="610" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#881337">/mcp/diag</text>
  <text x="610" y="360" text-anchor="middle" font-size="11" fill="#9f1239">allowlist: 7 read tools</text>
  <text x="610" y="377" text-anchor="middle" font-size="11" fill="#9f1239">get · describe · events · logs</text>
  <text x="610" y="394" text-anchor="middle" font-size="11" fill="#9f1239">yaml · api-resources · wait</text>
  <rect x="750" y="318" width="230" height="98" rx="8" fill="#ffffff" stroke="#fda4af"/>
  <text x="865" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#881337">/mcp/exec</text>
  <text x="865" y="360" text-anchor="middle" font-size="11" fill="#9f1239">allowlist: k8s_rollout, k8s_scale</text>
  <text x="865" y="377" text-anchor="middle" font-size="11" fill="#9f1239">human approval required</text>
  <text x="865" y="394" text-anchor="middle" font-size="11" fill="#9f1239">(enforced by admission)</text>
  <line x1="785" y1="222" x2="600" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="712" y="258" font-size="11" fill="#334155">LLM + MCP</text>

  <!-- bedrock -->
  <rect x="1030" y="310" width="155" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1107" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Amazon Bedrock</text>
  <text x="1107" y="358" text-anchor="middle" font-size="11" fill="#5b21b6">Claude Sonnet 4.5</text>
  <text x="1107" y="376" text-anchor="middle" font-size="11" fill="#5b21b6">EKS Pod Identity</text>
  <text x="1107" y="394" text-anchor="middle" font-size="11" fill="#5b21b6">InvokeModel only</text>
  <text x="1107" y="410" text-anchor="middle" font-size="11" fill="#5b21b6">no API keys</text>
  <line x1="1000" y1="365" x2="1028" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="1107" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">outside the cluster</text>

  <!-- tools -->
  <rect x="300" y="480" width="330" height="120" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="320" y="505" font-size="15" font-weight="700" fill="#713f12">ns kagent-tools · reader</text>
  <text x="320" y="528" font-size="12" fill="#854d0e">kagent-tools --read-only :8084 (2 replicas)</text>
  <text x="320" y="547" font-size="12" fill="#854d0e">RBAC get / list / watch, granted namespaces only</text>
  <text x="320" y="566" font-size="12" fill="#854d0e">no Secrets · no exec · no kube-system</text>
  <text x="320" y="587" font-size="12" fill="#854d0e">ingress: only from the gateway</text>
  <rect x="660" y="480" width="330" height="120" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="680" y="505" font-size="15" font-weight="700" fill="#713f12">ns kagent-executor · writer</text>
  <text x="680" y="528" font-size="12" fill="#854d0e">kagent-tools :8084, 2 tools (2 replicas)</text>
  <text x="680" y="547" font-size="12" fill="#854d0e">RBAC get + patch workloads, deployments/scale</text>
  <text x="680" y="566" font-size="12" fill="#854d0e">cannot read pods, logs or Secrets</text>
  <text x="680" y="587" font-size="12" fill="#854d0e">ingress: only from the gateway</text>
  <line x1="610" y1="418" x2="480" y2="478" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="865" y1="418" x2="830" y2="478" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- API -->
  <rect x="200" y="640" width="800" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="220" y="665" font-size="15" font-weight="700" fill="#312e81">Kubernetes API server · ValidatingAdmissionPolicies</text>
  <text x="220" y="688" font-size="12" fill="#3730a3">remediation guard (executor only): restart = restartedAt annotation only; scale 1..MAX_REPLICAS, at most ×2</text>
  <text x="220" y="707" font-size="12" fill="#3730a3">image / env / pause / ServiceAccount changes rejected even after a human approves</text>
  <text x="220" y="726" font-size="12" fill="#3730a3">agents must use governed-llm · remediation tools need requireApproval · MCP servers via gateway · no public LB</text>
  <text x="220" y="747" font-size="12" font-weight="700" fill="#312e81">namespaces: sre-sandbox (read + restart/scale) · radar (read only)</text>
  <line x1="465" y1="602" x2="465" y2="638" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="825" y1="602" x2="825" y2="638" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- blocked paths -->
  <line x1="120" y1="520" x2="295" y2="540" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="40" y="500" font-size="12" font-weight="700" fill="#b91c1c">✗ blocked by NetworkPolicy</text>
  <text x="40" y="515" font-size="11" fill="#b91c1c">any other pod → tool servers</text>
  <line x1="995" y1="560" x2="1150" y2="560" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="1030" y="540" font-size="12" font-weight="700" fill="#b91c1c">✗ internet egress</text>
  <text x="1030" y="580" font-size="11" fill="#b91c1c">tools · executor · kagent</text>

  <!-- observability -->
  <rect x="40" y="250" width="140" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="110" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">OTel collector</text>
  <text x="110" y="295" text-anchor="middle" font-size="11" fill="#334155">ns sre-observability</text>
  <text x="110" y="312" text-anchor="middle" font-size="11" fill="#334155">LLM + MCP spans</text>

  <text x="600" y="815" text-anchor="middle" font-size="13" fill="#0f172a">Proven on a live cluster by <tspan font-weight="700">make verify</tspan>: 60 / 60 checks passed (identity, gateway rules, RBAC, admission, network, egress, scaling)</text>
  <text x="600" y="838" text-anchor="middle" font-size="11" fill="#64748b">kagent 0.10.1 · kagent-tools 0.3.0 · agentgateway v1.5.0 · Gateway API v1.6.0 · OTel collector chart 0.174.0 · EKS 1.36</text>
</svg>
