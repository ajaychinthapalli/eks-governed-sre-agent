# Generated by `make configure ENV=dev` from envs/dev.env. Do not edit; edit the env file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/base
  - app-scope.yaml
  - egress.yaml
configMapGenerator:
  - name: sre-cluster-settings
    namespace: kagent
    envs: [settings.env]
    options:
      disableNameSuffixHash: true
labels:
  - pairs: { app.kubernetes.io/part-of: governed-sre-agent }
    includeSelectors: false
replacements:
  - source: { kind: ConfigMap, name: sre-cluster-settings, fieldPath: data.LLM_MODEL }
    targets:
      - select: { kind: AgentgatewayBackend, name: llm-provider }
        fieldPaths: [spec.ai.provider.bedrock.model]
      - select: { kind: ModelConfig, name: governed-llm }
        fieldPaths: [spec.model]
  - source: { kind: ConfigMap, name: sre-cluster-settings, fieldPath: data.AWS_REGION }
    targets:
      - select: { kind: AgentgatewayBackend, name: llm-provider }
        fieldPaths: [spec.ai.provider.bedrock.region]
patches:
  # LLM budget per proxy replica (LLM_TOKENS_PER_MINUTE, LLM_REQUESTS_PER_MINUTE)
  - target: { kind: AgentgatewayPolicy, name: llm-budget }
    patch: |-
      - op: replace
        path: /spec/traffic/rateLimit/local/0/tokens
        value: 400000
      - op: replace
        path: /spec/traffic/rateLimit/local/1/requests
        value: 120
