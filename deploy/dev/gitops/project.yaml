  name: sre-agent-kagent
  url: ghcr.io/kagent-dev/kagent/helm
  enableOCI: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-repo-kagent-tools-oci
  namespace: argocd
  labels: { argocd.argoproj.io/secret-type: repository }
