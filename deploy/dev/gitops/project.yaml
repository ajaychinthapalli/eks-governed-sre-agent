# Generated by `make configure ENV=dev` from envs/dev.env. Do not edit; edit the env file.
# Applied by scripts/install.sh before the root app. Fences what Argo CD may deploy for the agent:
# which repositories it pulls from and which namespaces it writes to. Nothing else in Argo CD changes.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sre-agent
  namespace: argocd
spec:
  description: Governed SRE agent (dev, ac-ws-dev-use2)
  sourceRepos:
    - https://github.com/acme/eks-governed-sre-agent.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - cr.agentgateway.dev/charts
    - ghcr.io/kagent-dev/kagent/helm
    - ghcr.io/kagent-dev/tools/helm
    - https://open-telemetry.github.io/opentelemetry-helm-charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: default }
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: agentgateway-system }
    - { server: https://kubernetes.default.svc, namespace: kagent }
    - { server: https://kubernetes.default.svc, namespace: kagent-tools }
    - { server: https://kubernetes.default.svc, namespace: kagent-executor }
    - { server: https://kubernetes.default.svc, namespace: sre-observability }
    - { server: https://kubernetes.default.svc, namespace: sre-sandbox }
    - { server: https://kubernetes.default.svc, namespace: radar }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-repo-agentgateway-oci
  namespace: argocd
  labels: { argocd.argoproj.io/secret-type: repository }
stringData:
