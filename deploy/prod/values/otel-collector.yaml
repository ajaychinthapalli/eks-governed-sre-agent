# Generated by `make configure ENV=prod` from envs/prod.env. Do not edit; edit the env file.
config:
  service:
    pipelines:
      traces:  { exporters: [debug] }
      metrics: { exporters: [debug] }
      logs:    { exporters: [debug] }
extraEnvs:
  - { name: CLOUD_PROVIDER, value: "aws" }
  - { name: CLOUD_REGION,   value: "us-east-1" }
  - { name: CLUSTER_NAME,   value: "prod-1" }
  - { name: ENVIRONMENT,    value: "prod" }
  # 127.0.0.1 = placeholder while no central backend is set (pipelines then export to debug only)
  - { name: CENTRAL_OTLP_ENDPOINT, value: "http://127.0.0.1:4318" }
  - name: CENTRAL_OTLP_AUTH
    valueFrom:
      secretKeyRef: { name: central-otlp, key: authorization, optional: true }
