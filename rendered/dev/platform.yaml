---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: kagent-executor
  namespace: kagent-executor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kagent-executor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: kagent-tools
  namespace: kagent-tools
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kagent-tools
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-agent-governed
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - kagent.dev
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - agents
  validations:
  - expression: object.spec.type == 'Declarative'
    message: Only Declarative agents are allowed (BYO agent images bypass the gateway).
  - expression: has(object.spec.declarative) && has(object.spec.declarative.modelConfig)
      && object.spec.declarative.modelConfig == 'governed-llm'
    message: 'Agents must set declarative.modelConfig: governed-llm'
  - expression: |-
      !has(object.spec.declarative) || !has(object.spec.declarative.tools) || object.spec.declarative.tools.all(t, t.type != 'McpServer' ||

        (has(t.mcpServer) && has(t.mcpServer.kind) && t.mcpServer.kind == 'RemoteMCPServer' &&
         t.mcpServer.name != 'kagent-tool-server'))
    message: Agent MCP tools must come from a RemoteMCPServer that points at agentgateway.
  - expression: |-
      !has(object.spec.declarative) || !has(object.spec.declarative.tools) || object.spec.declarative.tools.all(t, t.type != 'McpServer' || !has(t.mcpServer) ||

        t.mcpServer.name != 'k8s-remediation' ||
        (has(t.mcpServer.toolNames) && has(t.mcpServer.requireApproval) &&
         t.mcpServer.toolNames.all(n, n in t.mcpServer.requireApproval)))
    message: Every tool an agent uses from k8s-remediation must be listed in requireApproval
      (a person approves every write).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-gateway-not-public
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agentgateway-system
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: |-
      object.spec.type != 'LoadBalancer' || (has(object.metadata.annotations) && (

        ('service.beta.kubernetes.io/aws-load-balancer-scheme' in object.metadata.annotations &&
           object.metadata.annotations['service.beta.kubernetes.io/aws-load-balancer-scheme'] == 'internal') ||
        ('service.beta.kubernetes.io/aws-load-balancer-internal' in object.metadata.annotations &&
           object.metadata.annotations['service.beta.kubernetes.io/aws-load-balancer-internal'] == 'true')))
    message: Services in agentgateway-system must be ClusterIP or an INTERNAL load
      balancer.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-mcp-via-gateway
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: object.metadata.name != 'kagent-tool-server'
    name: skip-chart-builtin
  matchConstraints:
    resourceRules:
    - apiGroups:
      - kagent.dev
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - remotemcpservers
  validations:
  - expression: object.spec.url.startsWith('http://agentgateway-proxy.agentgateway-system.svc')
    message: RemoteMCPServer url must go through agentgateway (http://agentgateway-proxy.agentgateway-system.svc.cluster.local/...).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-modelconfig-via-gateway
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: object.metadata.name != 'default-model-config'
    name: skip-chart-default
  matchConstraints:
    resourceRules:
    - apiGroups:
      - kagent.dev
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - modelconfigs
  validations:
  - expression: '!has(object.spec.provider) || object.spec.provider == ''OpenAI'''
    message: ModelConfigs must use provider OpenAI pointed at agentgateway; the gateway
      talks to the real provider.
  - expression: has(object.spec.openAI) && has(object.spec.openAI.baseUrl) && object.spec.openAI.baseUrl.startsWith('http://agentgateway-proxy.agentgateway-system.svc')
    message: ModelConfig openAI.baseUrl must be http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-remediation-restart-only
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:kagent-executor:kagent-executor'
    name: only-the-sre-tool-server
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - daemonsets
  validations:
  - expression: object.spec.all(f, f == 'template' || (f in oldObject.spec && object.spec[f]
      == oldObject.spec[f])) && oldObject.spec.all(f, f == 'template' || f in object.spec)
    message: 'The SRE agent may only restart this workload: replicas, strategy, selector,
      paused and every other spec field must stay unchanged (use the scale tool to
      scale).'
  - expression: object.spec.template.spec == oldObject.spec.template.spec
    message: 'The SRE agent may only restart this workload: the pod spec (images,
      env, resources, service account, security context, volumes...) must stay unchanged.'
  - expression: |-
      has(object.spec.template.metadata.labels) == has(oldObject.spec.template.metadata.labels) && (!has(object.spec.template.metadata.labels) ||

        object.spec.template.metadata.labels == oldObject.spec.template.metadata.labels)
    message: 'The SRE agent may only restart this workload: pod template labels must
      stay unchanged.'
  - expression: |-
      (!has(object.spec.template.metadata.annotations) ||

        object.spec.template.metadata.annotations.all(k, k == 'kubectl.kubernetes.io/restartedAt' ||
          (has(oldObject.spec.template.metadata.annotations) &&
           k in oldObject.spec.template.metadata.annotations &&
           oldObject.spec.template.metadata.annotations[k] == object.spec.template.metadata.annotations[k]))) &&
      (!has(oldObject.spec.template.metadata.annotations) ||

        oldObject.spec.template.metadata.annotations.all(k, k == 'kubectl.kubernetes.io/restartedAt' ||
          (has(object.spec.template.metadata.annotations) && k in object.spec.template.metadata.annotations)))
    message: 'The SRE agent may only restart this workload: the only pod template
      annotation it may change is kubectl.kubernetes.io/restartedAt.'
  - expression: has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels)
      || object.metadata.labels == oldObject.metadata.labels)
    message: The SRE agent may not change workload labels.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-remediation-scale-bounds
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:kagent-executor:kagent-executor'
    name: only-the-sre-tool-server
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - deployments/scale
      - statefulsets/scale
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
  - expression: variables.target >= 1
    message: The SRE agent may not scale a workload to zero.
  - expression: variables.target <= variables.cap
    messageExpression: '''The SRE agent may scale to at most '' + string(variables.cap)
      + '' replicas (requested '' + string(variables.target) + '').'''
  - expression: 'variables.target <= (variables.current < 1 ? 2 : variables.current
      * 2)'
    messageExpression: '''The SRE agent may at most double replicas in one step (''
      + string(variables.current) + '' -> '' + string(variables.target) + '').'''
  variables:
  - expression: 'has(object.spec.replicas) ? object.spec.replicas : 0'
    name: target
  - expression: 'has(oldObject.spec.replicas) ? oldObject.spec.replicas : 0'
    name: current
  - expression: int(params.data.MAX_REPLICAS)
    name: cap
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-agent-governed
spec:
  policyName: sre-agent-governed
  validationActions:
  - Deny
  - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-gateway-not-public
spec:
  policyName: sre-gateway-not-public
  validationActions:
  - Deny
  - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-mcp-via-gateway
spec:
  policyName: sre-mcp-via-gateway
  validationActions:
  - Deny
  - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-modelconfig-via-gateway
spec:
  policyName: sre-modelconfig-via-gateway
  validationActions:
  - Deny
  - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-remediation-restart-only
spec:
  policyName: sre-remediation-restart-only
  validationActions:
  - Deny
  - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-remediation-scale-bounds
spec:
  paramRef:
    name: sre-cluster-settings
    namespace: kagent
    parameterNotFoundAction: Deny
  policyName: sre-remediation-scale-bounds
  validationActions:
  - Deny
  - Audit
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: k8s-diagnostics
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: kagent-tools
      static:
        host: kagent-tools.kagent-tools.svc.cluster.local
        path: /mcp
        port: 8084
        protocol: StreamableHTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: k8s-remediation
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: kagent-executor
      static:
        host: kagent-executor.kagent-executor.svc.cluster.local
        path: /mcp
        port: 8084
        protocol: StreamableHTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: llm-provider
  namespace: agentgateway-system
spec:
  ai:
    provider:
      bedrock:
        model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
        region: us-east-2
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: agentgateway-proxy-params
  namespace: agentgateway-system
spec:
  deployment:
    spec:
      template:
        metadata:
          annotations:
            prometheus.io/port: "15020"
            prometheus.io/scrape: "true"
        spec:
          topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: agentgateway-proxy
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
  horizontalPodAutoscaler:
    spec:
      maxReplicas: 6
      metrics:
      - resource:
          name: cpu
          target:
            averageUtilization: 70
            type: Utilization
        type: Resource
      minReplicas: 2
  logging:
    format: json
  podDisruptionBudget:
    spec:
      minAvailable: 1
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    spec:
      type: ClusterIP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: llm-budget
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm
  traffic:
    rateLimit:
      local:
      - tokens: 400000
        unit: Minutes
      - burst: 10
        requests: 120
        unit: Minutes
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: llm-secret-guard
  namespace: agentgateway-system
spec:
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            action: Reject
            matches:
            - AKIA[0-9A-Z]{16}
            - ASIA[0-9A-Z]{16}
            - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            - '"type": ?"service_account"'
            - AIza[0-9A-Za-z_-]{35}
            - gh[pousr]_[A-Za-z0-9]{36,}
            - xox[baprs]-[A-Za-z0-9-]{10,}
          response:
            message: 'Blocked by agentgateway: the prompt contained what looks like
              a credential. Redact it and retry.'
            statusCode: 403
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: mcp-diagnostics-allowlist
  namespace: agentgateway-system
spec:
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - mcp.tool.name in ["k8s_get_resources", "k8s_describe_resource", "k8s_get_resource_yaml",
            "k8s_get_pod_logs", "k8s_get_events", "k8s_get_available_api_resources",
            "k8s_wait"]
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: k8s-diagnostics
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: mcp-remediation-allowlist
  namespace: agentgateway-system
spec:
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - mcp.tool.name in ["k8s_rollout", "k8s_scale"]
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: k8s-remediation
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: tracing
  namespace: agentgateway-system
spec:
  frontend:
    tracing:
      backendRef:
        name: opentelemetry-collector
        namespace: sre-observability
        port: 4317
      protocol: GRPC
      randomSampling: "true"
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy-params
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-proxy
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: llm-provider
    matches:
    - path:
        type: PathPrefix
        value: /v1/chat/completions
    timeouts:
      request: 300s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: mcp-diagnostics
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-proxy
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: k8s-diagnostics
    matches:
    - path:
        type: PathPrefix
        value: /mcp/diag
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: mcp-remediation
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-proxy
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: k8s-remediation
    matches:
    - path:
        type: PathPrefix
        value: /mcp/exec
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: allow-agentgateway-tracing
  namespace: sre-observability
spec:
  from:
  - group: agentgateway.dev
