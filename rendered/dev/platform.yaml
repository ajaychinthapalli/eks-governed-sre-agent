  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-agent-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-cluster-read
subjects:
- kind: ServiceAccount
  name: kagent-tools
  namespace: kagent-tools
---
apiVersion: v1
data:
  ARGOCD_CONTROLLER: system:serviceaccount:argocd:argocd-application-controller
  AWS_REGION: us-east-2
  BREAKGLASS_GROUPS: system:masters
  LLM_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  MAX_REPLICAS: "10"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: sre-cluster-settings
  namespace: kagent
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/part-of: governed-sre-agent
  name: agentgateway-placeholder-key
  namespace: kagent
stringData:
  key: not-a-real-key
