# LLM route -> backend `llm-provider` = Amazon Bedrock (llm-provider-bedrock.yaml),
# signed with SigV4 using the proxy's EKS Pod Identity role.
# Agents always speak OpenAI chat-completions to this route; the gateway translates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: llm-provider
          group: agentgateway.dev
          kind: AgentgatewayBackend
      timeouts:
        request: 300s
---
# Two MCP routes, one per identity:
#   /mcp/diag -> kagent-tools     (read-only server, 7 tools)
#   /mcp/exec -> kagent-executor  (restart + scale only, approval required)
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: k8s-diagnostics
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: kagent-tools
        static:
          host: kagent-tools.kagent-tools.svc.cluster.local
          port: 8084
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: k8s-remediation
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: kagent-executor
        static:
          host: kagent-executor.kagent-executor.svc.cluster.local
          port: 8084
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-diagnostics
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/diag
      backendRefs:
        - name: k8s-diagnostics
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-remediation
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/exec
      backendRefs:
        - name: k8s-remediation
          group: agentgateway.dev
          kind: AgentgatewayBackend
